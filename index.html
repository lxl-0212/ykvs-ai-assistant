<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1556a8">
<title>鶯歌工商｜校務 AI 助理</title>
<style>
:root{
  color-scheme:light;
  --bg:#f4f7f6;--bg2:#eef3f2;--card:#ffffff;--card-soft:#f8faf9;
  --primary:#315d72;--primary-strong:#25495b;--primary-soft:#e8f1f4;
  --sage:#6f8f84;--sage-soft:#edf4f1;--gold:#b59a68;
  --ink:#263640;--muted:#71818a;--line:#dce5e7;--line-strong:#cbd8dc;
  --success:#4f7f69;--success-soft:#edf6f1;
  --shadow:0 12px 34px rgba(39,61,70,.075);--shadow-sm:0 5px 18px rgba(39,61,70,.055);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:
  radial-gradient(circle at 8% 0%,rgba(184,207,216,.32),transparent 28%),
  linear-gradient(180deg,var(--bg2) 0,#f7f9f8 360px,var(--bg) 100%);
  color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;
  -webkit-font-smoothing:antialiased}
main{width:min(1120px,100%);margin:auto;padding:28px 20px 44px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px;padding:2px 2px}
.brand{display:flex;align-items:center;gap:14px}.crest{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;
  color:#fff;background:linear-gradient(145deg,var(--primary),var(--primary-strong));font-size:23px;
  box-shadow:0 9px 24px rgba(49,93,114,.20);border:1px solid rgba(255,255,255,.5)}
h1{font-size:clamp(1.3rem,3vw,1.8rem);letter-spacing:-.02em;margin:0;font-weight:760}.sub{margin:5px 0 0;color:var(--muted);font-size:.88rem}
.status{white-space:nowrap;background:var(--success-soft);color:var(--success);border:1px solid #d3e6dc;border-radius:999px;padding:7px 12px;font-size:.78rem;font-weight:650}
.grid{display:grid;grid-template-columns:238px 1fr;gap:18px;align-items:start}
.card{background:rgba(255,255,255,.94);border:1px solid rgba(210,222,225,.9);border-radius:20px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.side{padding:14px;height:max-content;position:sticky;top:14px}.side h2{font-size:.88rem;margin:5px 8px 11px;color:#5d7079;font-weight:700}
.nav{display:grid;gap:6px}.nav button{width:100%;text-align:left;border:1px solid transparent;background:transparent;color:#3e5661;
  border-radius:12px;padding:10px 11px;font:inherit;cursor:pointer;transition:.18s ease}
.nav button:hover{background:#f3f7f6;border-color:#dce7e4;color:var(--primary-strong);transform:translateX(1px)}
.nav button.active{background:var(--primary-soft);border-color:#cddfe5;color:var(--primary-strong);font-weight:700;box-shadow:inset 3px 0 0 var(--primary)}
.side .note{margin:14px 7px 4px;padding-top:12px;border-top:1px solid var(--line);font-size:.76rem;line-height:1.65;color:var(--muted)}
.chat{padding:17px}.welcome{padding:15px 16px;border:1px solid #d9e5e8;background:linear-gradient(135deg,#f7fbfa,#f2f7f7);
  border-radius:15px;margin-bottom:12px}.welcome strong{display:block;margin-bottom:4px;color:#304c59}.welcome span{color:var(--muted);font-size:.85rem}
#log{height:min(54vh,560px);min-height:330px;overflow:auto;padding:2px 3px 12px;scrollbar-width:thin;scrollbar-color:#c8d5d8 transparent}
.msg{margin:9px 0;padding:12px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.72}
.user{background:var(--primary-soft);margin-left:14%;border:1px solid #d2e1e6;color:#294653}.assistant{background:#fff;border:1px solid #e1e8e9;margin-right:6%;box-shadow:var(--shadow-sm)}
.meta{color:#7a8a91;font-size:.74rem;margin-bottom:4px;font-weight:700}
.examples{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 12px}.examples button{border:1px solid #d3dfe2;background:#fff;color:#49636e;
  border-radius:999px;padding:7px 10px;cursor:pointer;font:inherit;font-size:.81rem;transition:.16s ease}
.examples button:hover{border-color:#b7cdd4;background:#f3f8f9;color:var(--primary-strong);transform:translateY(-1px)}
label{display:block;font-weight:700;margin:7px 0;color:#3a505a}
textarea{display:block;width:100%;min-height:78px;resize:vertical;padding:12px 13px;border:1px solid #c7d4d8;border-radius:12px;font:inherit;background:#fff;color:var(--ink);transition:.18s ease}
textarea::placeholder{color:#9aa8ad}textarea:focus{outline:3px solid rgba(49,93,114,.10);border-color:#7fa4b2;box-shadow:0 0 0 1px rgba(49,93,114,.08)}
.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:9px}.actions button{border:0;border-radius:11px;padding:9px 17px;
  color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-strong));font:inherit;font-weight:650;cursor:pointer;
  box-shadow:0 5px 14px rgba(49,93,114,.16);transition:.16s ease}
.actions button:hover{transform:translateY(-1px);box-shadow:0 7px 18px rgba(49,93,114,.20)}.actions button:disabled{opacity:.55;cursor:wait;transform:none}
.actions .clear{border:1px solid #cfdadd;background:#fff;color:#526872;box-shadow:none}.actions .clear:hover{background:#f5f8f8}
.hint,footer{font-size:.77rem;color:#7a8a91}footer{margin-top:13px;line-height:1.6}
@media(max-width:760px){.grid{grid-template-columns:1fr}.side{position:static}.nav{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){main{padding:14px 10px 26px}.chat{padding:11px}.side{padding:10px}.nav{grid-template-columns:1fr 1fr}
#log{min-height:280px}.user{margin-left:3%}.assistant{margin-right:2%}.hero{align-items:flex-start}.status{display:none}}
</style>
</head>
<body>
<main>
<header class="hero">
  <div class="brand">
    <div class="crest" aria-hidden="true">🎓</div>
    <div><h1>鶯歌工商校務 AI 助理</h1><p class="sub">校園公開資料 × MCP × AI 快速查詢</p></div>
  </div>
  <div class="status">● 查詢服務</div>
</header>

<div class="grid">
  <aside class="card side" aria-label="快速分類">
    <h2>快速分類</h2>
    <div class="nav">
      <button class="active" data-query="鶯歌工商生活輔導組分機是多少？">☎ 分機查詢</button>
      <button data-query="資二忠班級分機是多少？">🏫 班級／場館</button>
      <button data-query="鶯歌工商學生學習評量補充規定，段考成績如何計算？">📊 成績考核</button>
      <button data-query="鶯歌工商段考補考規定與申請方式">📝 段考／補考</button>
      <button data-query="鶯歌工商重修補修有哪些規定？">📚 重修／補修</button>
      <button data-query="鶯歌工商學生抵免學分規定">🎓 學分／畢業</button>
      <button data-query="鶯歌工商學生學習歷程檔案作業補充規定">🗂 學習歷程</button>
      <button data-query="鶯歌工商學生請假規則，病假返校後多久要補辦？">📌 學務法規</button>
    </div>
    <div class="note">查詢法規時，回答會優先使用已建置的校方資料；若僅有官方文件索引，會直接附上校方原始來源，不自行補寫未提供的條文。</div>
  </aside>

  <section class="card chat" aria-label="校務資料查詢">
    <div class="welcome"><strong>今天想查什麼？</strong><span>可以直接用自然語言提問，例如「補考幾次？」、「段考沒考怎麼辦？」</span></div>
    <div id="log" role="log" aria-live="polite" aria-label="對話紀錄"></div>

    <div class="examples" aria-label="熱門問題">
      <button data-query="段考補考需要什麼條件？">段考補考</button>
      <button data-query="學期成績不及格可以補考嗎？">學期補考</button>
      <button data-query="鶯歌工商重修補修怎麼辦？">重修補修</button>
      <button data-query="成績怎麼計算？">成績考核</button>
      <button data-query="115-1 10/6 有哪些行程？">行事曆</button>
    </div>

    <label for="msg">輸入問題</label>
    <textarea id="msg" placeholder="例如：段考沒參加，可以申請補考嗎？"></textarea>
    <div class="actions">
      <span class="hint">Enter + Ctrl／⌘ 送出　•　可連續追問</span>
      <div><button id="clear" class="clear" type="button">清除</button> <button id="send" type="button">送出</button></div>
    </div>
  </section>
</div>
<footer>資料以鶯歌工商校方公開文件為基礎；法規、考試與辦理期限如有更新，請以校方最新公告及正式文件為準。</footer>
</main>

<script>
const logEl=document.getElementById('log'),msgEl=document.getElementById('msg'),sendBtn=document.getElementById('send');
const messages=[];
function appendTextWithLinks(parent,text){
 const pattern=/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)|(https?:\/\/[^\s<>"')\]]+)/g;let last=0,m;
 while((m=pattern.exec(text))!==null){
  parent.appendChild(document.createTextNode(text.slice(last,m.index)));
  const label=m[1]||m[3],href=m[2]||m[3];
  try{const u=new URL(href);if(/^https?:$/.test(u.protocol)){const a=document.createElement('a');a.href=u.href;a.textContent=label;a.target='_blank';a.rel='noopener noreferrer';parent.appendChild(a)}else parent.appendChild(document.createTextNode(m[0]))}
  catch{parent.appendChild(document.createTextNode(m[0]))}last=pattern.lastIndex;
 }
 parent.appendChild(document.createTextNode(text.slice(last)));
}
function render(role,text){
 const div=document.createElement('div');div.className='msg '+role;
 const meta=document.createElement('div');meta.className='meta';meta.textContent=role==='user'?'使用者':'校務 AI 助理';
 div.appendChild(meta);appendTextWithLinks(div,String(text??''));logEl.appendChild(div);logEl.scrollTop=logEl.scrollHeight;
}
async function send(query){
 const text=String(query??msgEl.value).trim();if(!text||sendBtn.disabled)return;
 messages.push({role:'user',content:text});render('user',text);msgEl.value='';sendBtn.disabled=true;
 try{
  const chatUrl=new URL('./chat',window.location.href);
  const res=await fetch(chatUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages})});
  const body=await res.text();let data={};try{data=body?JSON.parse(body):{}}catch{data={error:body}}
  if(!res.ok)throw new Error(data.error||`${res.status} ${res.statusText||'伺服器回應錯誤'}`);
  if(Array.isArray(data.messages)){messages.length=0;messages.push(...data.messages)}
  render('assistant',data.reply||'目前沒有收到文字回答。');
 }catch(err){render('assistant','查詢失敗：'+err.message+'。請確認服務正在執行。')}
 finally{sendBtn.disabled=false;msgEl.focus()}
}
sendBtn.addEventListener('click',()=>send());
msgEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))send()});
document.querySelectorAll('[data-query]').forEach(btn=>btn.addEventListener('click',()=>send(btn.dataset.query)));
document.getElementById('clear').addEventListener('click',()=>{messages.length=0;logEl.replaceChildren();msgEl.focus()});
</script>
</body>
</html>
