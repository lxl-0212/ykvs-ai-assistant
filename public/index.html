<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#315d72">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>鶯歌工商｜校務 AI 助理</title>
<style>
:root{
  color-scheme:light;
  --bg:#f4f7f6;--bg2:#eef3f2;--card:#ffffff;--card-soft:#f8faf9;
  --primary:#315d72;--primary-strong:#25495b;--primary-soft:#e8f1f4;
  --sage:#6f8f84;--sage-soft:#edf4f1;--gold:#b59a68;
  --ink:#263640;--muted:#71818a;--line:#dce5e7;--line-strong:#cbd8dc;
  --success:#4f7f69;--success-soft:#edf6f1;
  --shadow:0 12px 34px rgba(39,61,70,.075);--shadow-sm:0 5px 18px rgba(39,61,70,.055);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:
  radial-gradient(circle at 8% 0%,rgba(184,207,216,.32),transparent 28%),
  linear-gradient(180deg,var(--bg2) 0,#f7f9f8 360px,var(--bg) 100%);
  color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;
  -webkit-font-smoothing:antialiased}
main{width:min(1080px,100%);margin:auto;padding:24px 18px 40px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px;padding:2px 2px}
.brand{display:flex;align-items:center;gap:14px}.crest{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;
  color:#fff;background:linear-gradient(145deg,var(--primary),var(--primary-strong));font-size:23px;
  box-shadow:0 9px 24px rgba(49,93,114,.20);border:1px solid rgba(255,255,255,.5)}
h1{font-size:clamp(1.3rem,3vw,1.8rem);letter-spacing:-.02em;margin:0;font-weight:760}.sub{margin:5px 0 0;color:var(--muted);font-size:.88rem}
.status{white-space:nowrap;background:var(--success-soft);color:var(--success);border:1px solid #d3e6dc;border-radius:999px;padding:7px 12px;font-size:.78rem;font-weight:650}
.grid{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start}
.card{background:rgba(255,255,255,.96);border:1px solid rgba(210,222,225,.85);border-radius:18px;box-shadow:0 8px 26px rgba(39,61,70,.06);backdrop-filter:blur(8px)}
.side{padding:14px;height:max-content;position:sticky;top:14px}.side h2{font-size:.88rem;margin:5px 8px 11px;color:#5d7079;font-weight:700}
.nav{display:grid;gap:6px}.nav button{width:100%;text-align:left;border:1px solid transparent;background:transparent;color:#3e5661;
  border-radius:12px;padding:10px 11px;font:inherit;cursor:pointer;transition:.18s ease}
.nav button:hover{background:#f3f7f6;border-color:#dce7e4;color:var(--primary-strong);transform:translateX(1px)}
.nav button.active{background:var(--primary-soft);border-color:#cddfe5;color:var(--primary-strong);font-weight:700;box-shadow:inset 3px 0 0 var(--primary)}
.side .note{margin:14px 7px 4px;padding-top:12px;border-top:1px solid var(--line);font-size:.76rem;line-height:1.65;color:var(--muted)}
.chat{padding:17px}.welcome{padding:15px 16px;border:1px solid #d9e5e8;background:linear-gradient(135deg,#f7fbfa,#f2f7f7);
  border-radius:15px;margin-bottom:12px}.welcome strong{display:block;margin-bottom:4px;color:#304c59}.welcome span{color:var(--muted);font-size:.85rem}
#log{height:min(54vh,560px);min-height:330px;overflow:auto;padding:2px 3px 12px;scrollbar-width:thin;scrollbar-color:#c8d5d8 transparent}
.msg{margin:9px 0;padding:12px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.72}
.user{background:var(--primary-soft);margin-left:14%;border:1px solid #d2e1e6;color:#294653}.assistant{background:#fff;border:1px solid #e1e8e9;margin-right:6%;box-shadow:var(--shadow-sm)}
.meta{color:#7a8a91;font-size:.74rem;margin-bottom:4px;font-weight:700}
.tag-section{margin:2px 0 14px}.tag-section-title{display:flex;align-items:center;gap:8px;margin:0 0 8px;color:#4b626b;font-size:.78rem;font-weight:750}.tag-section-title:before{content:'';width:5px;height:16px;border-radius:99px;background:linear-gradient(180deg,#6f9dad,#7ea58f)}
.quick-tags,.examples{display:flex;flex-wrap:wrap;gap:8px;margin:0}.examples{margin-top:0}.examples button,.quick-tag{position:relative;overflow:hidden;border:1px solid rgba(120,150,160,.25);background:linear-gradient(135deg,#fff 0%,#f7faf9 52%,#edf4f2 100%);color:#4d6870;border-radius:999px;padding:7px 12px;cursor:pointer;font:inherit;font-size:.8rem;line-height:1.2;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;box-shadow:0 2px 6px rgba(70,100,105,.055)}
.examples button:hover,.quick-tag:hover{transform:translateY(-1px);border-color:rgba(82,130,140,.38);box-shadow:0 5px 12px rgba(70,100,105,.10)}
.quick-tag.score{background:linear-gradient(135deg,#fff,#edf4ff);color:#41678a}.quick-tag.credit{background:linear-gradient(135deg,#fff,#edf6f1);color:#4c7564}.quick-tag.student{background:linear-gradient(135deg,#fff,#f3eef8);color:#6b5b7d}.quick-tag.other{background:linear-gradient(135deg,#fff,#f8f2e8);color:#806b4f}
.composer{position:relative;margin-top:10px;padding:2px;border-radius:18px;background:linear-gradient(135deg,#d9e8ea,#eef4f1,#d4e2e5);box-shadow:0 7px 20px rgba(52,80,89,.055)}
.composer-inner{background:rgba(255,255,255,.98);border-radius:16px;padding:14px 14px 11px}.composer-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 2px 8px}.composer-label{font-size:.83rem;font-weight:750;color:#3d5661;display:flex;align-items:center;gap:7px}.composer-label .dot{width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,#6f9dad,#7ea58f);box-shadow:0 0 0 4px #edf5f3}.composer-tip{font-size:.72rem;color:#8a999f;background:#f4f7f7;border:1px solid #e1e9ea;padding:4px 8px;border-radius:999px}
textarea{display:block;width:100%;min-height:108px;resize:vertical;padding:13px 14px;border:1px solid #d2dee1;border-radius:13px;font:inherit;line-height:1.65;background:linear-gradient(180deg,#fcfefe,#f6faf9);color:var(--ink);transition:border-color .2s ease,box-shadow .2s ease,background .2s ease;outline:none}
textarea::placeholder{color:#a5b1b5}textarea:hover{border-color:#b9cbd0}textarea:focus{border-color:#78a1ad;background:#fff;box-shadow:0 0 0 4px rgba(82,130,140,.10),0 8px 22px rgba(60,90,100,.08)}
.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;padding:0 1px}.actions button{position:relative;overflow:hidden;border:0;border-radius:12px;padding:10px 18px;color:#fff;background:linear-gradient(135deg,#416f80,#294f60);font:inherit;font-weight:700;cursor:pointer;box-shadow:0 6px 15px rgba(49,93,114,.18);transition:.18s ease}.actions button:hover{transform:translateY(-1px);box-shadow:0 8px 19px rgba(49,93,114,.23)}.actions button:active{transform:translateY(0)}.actions button:disabled{opacity:.55;cursor:wait;transform:none}.actions .clear{border:1px solid #d0dcdf;background:linear-gradient(135deg,#fff,#f4f7f7);color:#526872;box-shadow:none}.actions .clear:hover{background:#f1f6f6}.hint,footer{font-size:.77rem;color:#7a8a91}.ripple{position:absolute;border-radius:50%;transform:scale(0);animation:ripple .55s ease-out;background:rgba(255,255,255,.48);pointer-events:none}@keyframes ripple{to{transform:scale(3.8);opacity:0}}footer{margin-top:13px;line-height:1.6}
@media(max-width:760px){.grid{grid-template-columns:1fr}.side{position:static}.nav{grid-template-columns:repeat(2,1fr)}.hero{margin-bottom:12px}.chat{padding:13px}.tag-section{margin-bottom:13px}}
@media(max-width:560px){main{padding:12px 9px 24px}.chat{padding:10px}.side{padding:10px}.nav{grid-template-columns:1fr 1fr}
#log{min-height:280px}.user{margin-left:3%}.assistant{margin-right:2%}.hero{align-items:flex-start}.status{display:none}}
</style>
</head>
<body>
<main>
<header class="hero">
  <div class="brand">
    <div class="crest" aria-hidden="true">🎓</div>
    <div><h1>鶯歌工商校務 AI 助理</h1><p class="sub">校園公開資料 × MCP × AI 快速查詢</p></div>
  </div>
  <div class="status">● 查詢服務</div>
</header>

<div class="grid">
  <aside class="card side" aria-label="快速分類">
    <h2>快速分類</h2>
    <div class="nav">
      <button class="active" data-query="鶯歌工商生活輔導組分機是多少？">☎ 分機查詢</button>
      <button data-query="資二忠班級分機是多少？">🏫 班級／場館</button>
      <button data-query="鶯歌工商學生學習評量補充規定，段考成績如何計算？">📊 成績考核</button>
      <button data-query="鶯歌工商段考補考規定與申請方式">📝 段考／補考</button>
      <button data-query="鶯歌工商重修補修有哪些規定？">📚 重修／補修</button>
      <button data-query="鶯歌工商學生抵免學分規定">🎓 學分／畢業</button>
      <button data-query="鶯歌工商學生學習歷程檔案作業補充規定">🗂 學習歷程</button>
      <button data-query="鶯歌工商學生請假規則，病假返校後多久要補辦？">📌 學務法規</button>
    </div>
    <div class="note">查詢法規時，回答會優先使用已建置的校方資料；若僅有官方文件索引，會直接附上校方原始來源，不自行補寫未提供的條文。</div>
  </aside>

  <section class="card chat" aria-label="校務資料查詢">
    <div class="welcome"><strong>今天想查什麼？</strong><span>可以直接用自然語言提問，例如「補考幾次？」、「段考沒考怎麼辦？」</span></div>
    <div id="log" role="log" aria-live="polite" aria-label="對話紀錄"></div>

    <div class="tag-section">
      <div class="tag-section-title">常用查詢・成績與學分</div>
      <div class="quick-tags" aria-label="成績與學分查詢">
        <button class="quick-tag score" data-query="段考補考需要什麼條件？">📝 段考補考</button>
        <button class="quick-tag score" data-query="學期成績不及格可以補考嗎？">📋 學期補考</button>
        <button class="quick-tag score" data-query="鶯歌工商學生成績如何計算？">📊 成績考核</button>
        <button class="quick-tag score" data-query="鶯歌工商成績登錄相關規定">📈 成績登錄</button>
        <button class="quick-tag credit" data-query="鶯歌工商重修有哪些規定？">📚 重修</button>
        <button class="quick-tag credit" data-query="鶯歌工商補修有哪些規定？">📖 補修</button>
        <button class="quick-tag credit" data-query="鶯歌工商抵免學分規定">🎓 抵免學分</button>
        <button class="quick-tag credit" data-query="鶯歌工商畢業資格與畢業學分規定">🎯 畢業資格</button>
      </div>
    </div>
    <div class="tag-section">
      <div class="tag-section-title">學生事務與學籍</div>
      <div class="quick-tags" aria-label="學生事務與學籍查詢">
        <button class="quick-tag student" data-query="鶯歌工商編班規定">🏫 編班</button>
        <button class="quick-tag student" data-query="鶯歌工商轉班規定">🔄 轉班</button>
        <button class="quick-tag student" data-query="鶯歌工商休學與復學規定">📌 休學／復學</button>
        <button class="quick-tag student" data-query="鶯歌工商學生學習歷程檔案作業補充規定">🗂 學習歷程</button>
        <button class="quick-tag other" data-query="鶯歌工商學生請假規則">📝 學生請假</button>
        <button class="quick-tag other" data-query="鶯歌工商獎懲規定">🏅 獎懲規定</button>
        <button class="quick-tag other" data-query="鶯歌工商手機使用規定">📱 手機規定</button>
      </div>
    </div>
    <div class="tag-section">
      <div class="tag-section-title">校務與快速查詢</div>
      <div class="quick-tags" aria-label="校務快速查詢">
        <button class="quick-tag other" data-query="鶯歌工商生活輔導組分機是多少？">☎ 分機查詢</button>
        <button class="quick-tag other" data-query="資二忠班級分機是多少？">🏫 班級分機</button>
        <button class="quick-tag other" data-query="鶯歌工商有哪些場館分機？">🏢 場館分機</button>
        <button class="quick-tag other" data-query="鶯歌工商行事曆 115-1">📅 行事曆</button>
        <button class="quick-tag other" data-query="鶯歌工商校務規定">📜 校務規定</button>
        <button class="quick-tag other" data-query="鶯歌工商人才招募">💼 人才招募</button>
      </div>
    </div>
    <div class="composer">
      <div class="composer-inner">
        <div class="composer-head">
          <label class="composer-label" for="msg"><span class="dot"></span>輸入問題</label>
          <span class="composer-tip">Ctrl／⌘ + Enter 送出</span>
        </div>
        <textarea id="msg" placeholder="例如：段考沒參加，可以申請補考嗎？"></textarea>
        <div class="actions">
          <span class="hint">可以繼續追問，AI 會保留本次對話脈絡</span>
          <div><button id="clear" class="clear" type="button">清除</button> <button id="send" type="button">送出　➜</button></div>
        </div>
      </div>
    </div>
  </section>
</div>
<footer>資料以鶯歌工商校方公開文件為基礎；法規、考試與辦理期限如有更新，請以校方最新公告及正式文件為準。</footer>
</main>

<script>
const logEl=document.getElementById('log'),msgEl=document.getElementById('msg'),sendBtn=document.getElementById('send');
const messages=[];
function appendTextWithLinks(parent,text){
 const pattern=/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)|(https?:\/\/[^\s<>"')\]]+)/g;let last=0,m;
 while((m=pattern.exec(text))!==null){
  parent.appendChild(document.createTextNode(text.slice(last,m.index)));
  const label=m[1]||m[3],href=m[2]||m[3];
  try{const u=new URL(href);if(/^https?:$/.test(u.protocol)){const a=document.createElement('a');a.href=u.href;a.textContent=label;a.target='_blank';a.rel='noopener noreferrer';parent.appendChild(a)}else parent.appendChild(document.createTextNode(m[0]))}
  catch{parent.appendChild(document.createTextNode(m[0]))}last=pattern.lastIndex;
 }
 parent.appendChild(document.createTextNode(text.slice(last)));
}
function render(role,text){
 const div=document.createElement('div');div.className='msg '+role;
 const meta=document.createElement('div');meta.className='meta';meta.textContent=role==='user'?'使用者':'校務 AI 助理';
 div.appendChild(meta);appendTextWithLinks(div,String(text??''));logEl.appendChild(div);logEl.scrollTop=logEl.scrollHeight;
}
async function send(query, fromComposer=false){
 const text=String(query??msgEl.value).trim();if(!text||sendBtn.disabled)return;
 messages.push({role:'user',content:text});render('user',text);msgEl.value='';sendBtn.disabled=true;
 try{
  const chatUrl=new URL('./chat',window.location.href);
  const res=await fetch(chatUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages})});
  const body=await res.text();let data={};try{data=body?JSON.parse(body):{}}catch{data={error:body}}
  if(!res.ok)throw new Error(data.error||`${res.status} ${res.statusText||'伺服器回應錯誤'}`);
  if(Array.isArray(data.messages)){messages.length=0;messages.push(...data.messages)}
  render('assistant',data.reply||'目前沒有收到文字回答。');
 }catch(err){render('assistant','查詢失敗：'+err.message+'。請確認服務正在執行。')}
 finally{
   sendBtn.disabled=false;
   if(fromComposer){
     // 只有使用者自己在輸入框送出時才重新聚焦，避免快速分類把頁面拉到最下面
     msgEl.focus({preventScroll:true});
   }
 }
}
sendBtn.addEventListener('click',()=>send(undefined,true));
msgEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();send(undefined,true)}});
document.querySelectorAll('[data-query]').forEach(btn=>btn.addEventListener('click',()=>{
  // 快速分類不強制聚焦輸入框，也不改變目前頁面捲動位置
  send(btn.dataset.query,false);
}));
document.getElementById('clear').addEventListener('click',()=>{messages.length=0;logEl.replaceChildren();msgEl.focus()});

// 點擊漣漪：按鈕會從實際點擊位置產生柔和漣漪
document.addEventListener('click',e=>{
 const btn=e.target.closest('button'); if(!btn || btn.disabled)return;
 const r=btn.getBoundingClientRect(); const size=Math.max(r.width,r.height)*.55;
 const wave=document.createElement('span'); wave.className='ripple';
 wave.style.width=wave.style.height=size+'px';
 wave.style.left=(e.clientX-r.left-size/2)+'px'; wave.style.top=(e.clientY-r.top-size/2)+'px';
 btn.appendChild(wave); wave.addEventListener('animationend',()=>wave.remove());
});
</script>
</body>
</html>
